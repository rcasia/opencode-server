# Production app stack (ADR-0007, ADR-0015). Runs unmodified on the EC2 host
# (/opt/opencode, app.env written by user_data) and locally via
# `make test-boot` (app.env holds dummy values there).
# Images are pinned tag@digest; Dependabot (docker ecosystem) proposes bumps.
#
# Blue-green backends (ADR-0015): opencode-blue and opencode-green are
# identical; exactly one serves at a time (LIVE color in .live-color).
# app/switch.sh starts the idle color, waits for it to answer, then stops
# the live one — Caddy (stable edge, both upstreams, `first` policy +
# health checks) fails over with no failed requests. Never `up` the whole
# project on the host: that starts BOTH colors (dual-run splits brain and
# RAM). Name services explicitly (user_data, switch.sh, test-boot do).
services:
  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: always
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs:/var/log/caddy
    env_file:
      - app.env
    depends_on:
      - opencode-blue
      - opencode-green
      - oauth2-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  opencode-blue:
    image: ghcr.io/anomalyco/opencode:1.18.30@sha256:412b37a894bb937a0d5d6a1860789b9fd7d34a109334bec98a3f6ecf812bb442
    # Sandboxed backend (ADR-0020, ADR-0025): nono wraps `opencode web`
    # with the checked-in profile. docker.sock is CUT on purpose — agent
    # docker builds move out of the sandbox (the socket is host-root).
    # The pinned image is Alpine without git (issue #35): install it at
    # container start, before the sandbox applies, so agent git and the
    # boot git-setup work. Skipped safely when apk is absent (boot then
    # takes the existing git-setup WARNING path).
    # The nono binary is the musl build (./nono-container, from the S3
    # bundle at boot): the glibc build cannot exec on musl (missing ELF
    # interpreter; gcompat lacks __res_init). Upstream ships musl for
    # x86_64 only.
    # The touch pre-creates /root/.git-credentials so the profile's
    # single-file grant resolves at sandbox start (nono skips
    # bypass_protection entries that do not exist yet); later writes
    # truncate in place, so the grant survives. SYS_PTRACE is required
    # for nono's seccomp network-proxy handoff inside Docker (see
    # nono troubleshooting "Running Inside Docker/Podman"); it only
    # lets nono's parent duplicate an fd from its own child.
    # ./nono-container is the musl binary: fetched from the S3 bundle
    # at boot (/opt/opencode) and by test-boot locally ($APP_DIR).
    # Never the host glibc binary — it cannot exec on musl.
    # NOTE: this must be `entrypoint`, not `command` — the image bakes
    # in `ENTRYPOINT ["opencode"]`, so `command` would run
    # `opencode sh -c ...` (unknown subcommand, restart loop). A broken
    # entrypoint here once shipped past the deploy-prod smoke gate,
    # which only checks `/` (answered by the edge alone) and not
    # `/ready` — hence the /ready gate in deploy-prod smoke too.
    # `--allow-cwd` is load-bearing: nono skips the CWD prompt when
    # non-interactive, so without it the profile's workdir grant never
    # applies and the agent has no workspace.
    entrypoint: ["sh", "-c", "command -v apk >/dev/null && apk add -q --no-cache git || echo 'WARNING: no apk; container git unavailable'; touch /root/.git-credentials && chmod 600 /root/.git-credentials && exec /usr/local/bin/nono run --allow-cwd --profile /etc/nono/profile.json -- opencode web --hostname 0.0.0.0 --port 4096"]
    restart: always
    stop_grace_period: 30s
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
    pids_limit: 256
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    working_dir: /root/workspace
    volumes:
      - opencode-workspace:/root/workspace
      - ./opencode.json:/root/.config/opencode/opencode.json:ro
      - ./nono-profile.json:/etc/nono/profile.json:ro
      - ./nono-container:/usr/local/bin/nono:ro
      - opencode-data:/root/.local/share/opencode
    environment:
      BROWSER: "true"
    env_file:
      - app.env

  opencode-green:
    image: ghcr.io/anomalyco/opencode:1.18.30@sha256:412b37a894bb937a0d5d6a1860789b9fd7d34a109334bec98a3f6ecf812bb442
    # Same sandbox wrapping as opencode-blue (nono profile, docker.sock
    # cut, git installed at container start — see comment above).
    # `entrypoint`, not `command`: the image ENTRYPOINT is ["opencode"].
    entrypoint: ["sh", "-c", "command -v apk >/dev/null && apk add -q --no-cache git || echo 'WARNING: no apk; container git unavailable'; touch /root/.git-credentials && chmod 600 /root/.git-credentials && exec /usr/local/bin/nono run --allow-cwd --profile /etc/nono/profile.json -- opencode web --hostname 0.0.0.0 --port 4096"]
    restart: always
    stop_grace_period: 30s
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
    pids_limit: 256
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    working_dir: /root/workspace
    volumes:
      - opencode-workspace:/root/workspace
      - ./opencode.json:/root/.config/opencode/opencode.json:ro
      - ./nono-profile.json:/etc/nono/profile.json:ro
      - ./nono-container:/usr/local/bin/nono:ro
      - opencode-data:/root/.local/share/opencode
    environment:
      BROWSER: "true"
    env_file:
      - app.env

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    restart: always
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4180"
    env_file:
      - app.env
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202

volumes:
  caddy-data:
  caddy-config:
  opencode-workspace:
  opencode-data:
