# Production app stack (ADR-0007, ADR-0015). Runs unmodified on the EC2 host
# (/opt/opencode, app.env written by user_data) and locally via
# `make test-boot` (app.env holds dummy values there).
# Images are pinned tag@digest; Dependabot (docker ecosystem) proposes bumps.
#
# Blue-green backends (ADR-0015): opencode-blue and opencode-green are
# identical; exactly one serves at a time (LIVE color in .live-color).
# app/switch.sh starts the idle color, waits for it to answer, then stops
# the live one — Caddy (stable edge, both upstreams, `first` policy +
# health checks) fails over with no failed requests. Never `up` the whole
# project on the host: that starts BOTH colors (dual-run splits brain and
# RAM). Name services explicitly (user_data, switch.sh, test-boot do).
services:
  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs:/var/log/caddy
    env_file:
      - app.env
    depends_on:
      - opencode-blue
      - opencode-green
      - oauth2-proxy
    healthcheck:
      # Caddy admin API needs no auth; 401s on :443 would false-negative.
      # 127.0.0.1 (not localhost): busybox wget tries ::1 first and fails.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Color A of the blue-green pair. Shares every volume with color B: only
  # one runs at a time (brief overlap during a switch), so sessions and
  # workspace survive the switch on the same disk.
  opencode-blue:
    image: ghcr.io/anomalyco/opencode:1.18.30@sha256:412b37a894bb937a0d5d6a1860789b9fd7d34a109334bec98a3f6ecf812bb442
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: always
    stop_grace_period: 30s
    working_dir: /root
    volumes:
      - opencode-workspace:/root
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BROWSER: "true"
    env_file:
      - app.env

  # Color B of the blue-green pair. Identical to color A by construction —
  # keep the two services in sync (same image, command, volumes, env).
  opencode-green:
    image: ghcr.io/anomalyco/opencode:1.18.30@sha256:412b37a894bb937a0d5d6a1860789b9fd7d34a109334bec98a3f6ecf812bb442
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: always
    stop_grace_period: 30s
    working_dir: /root
    volumes:
      - opencode-workspace:/root
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BROWSER: "true"
    env_file:
      - app.env

  # Human gate for passwordless GitHub SSO (ADR-0014, issue #17). No
  # published ports — only reachable via Caddy forward_auth. Static knobs
  # live here; secrets + IDs arrive via app.env (OAUTH2_PROXY_* names, so
  # no compose interpolation is needed). Distroless base has no shell, so
  # no healthcheck — liveness is restart=always plus Caddy's gate.
  # Single instance (not blue-green: forward_auth takes one upstream): its
  # own image bumps restart it with a seconds-long SSO blip (ADR-0015).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    restart: always
    expose:
      - "4180"
    env_file:
      - app.env
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202

volumes:
  caddy-data:
  caddy-config:
  opencode-workspace:
  opencode-config:
  opencode-data:
