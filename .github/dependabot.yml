version: 2
updates:
  # GitHub Actions: check daily, but only propose versions at least
  # 21 days old (cooldown). Security updates bypass the cooldown by
  # design. Actions stay pinned to commit SHAs in the workflows;
  # dependabot bumps the SHA, never a floating tag, and a human merges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 21
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  # Terraform: same policy for required_version, provider constraints
  # (versions.tf) and any future external module sources.
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 21
    groups:
      terraform:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  # Docker: same policy for the pinned app images (app/compose.yaml).
  # Images stay pinned tag@digest; dependabot bumps tag and digest together.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: daily
    cooldown:
      default-days: 21
    groups:
      docker:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
