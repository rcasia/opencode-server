name: deploy

# Automatic prod deploys — no manual dispatch, no approvals.
# Trigger: runs only when the ci workflow completes (workflow_run), and
#   proceeds only if ci concluded success on main (PR branches never deploy).
# Pipeline: local-check (moto plan on the exact ci sha, no credentials)
#   -> deploy-prod (OIDC creds -> S3 init -> validate -> plan -out=tfplan
#   -> apply tfplan -> smoke test: instance reaches running).
# Requirements: AWS_ROLE_ARN secret + TF_STATE_BUCKET variable must exist;
#   missing secrets fail red on purpose (no silent skips).
# Rollback: revert the commit on main and push; the next green run
#   re-applies the previous state (state is versioned in S3).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_STATE_KEY: opencode-server/prod/terraform.tfstate

jobs:
  local-check:
    # branches: filter is invalid under workflow_run; gate on head_branch here.
    # Missing secrets fail red on purpose (no silent skips): configure
    # AWS_ROLE_ARN / TF_STATE_BUCKET before expecting green.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Start moto server
        run: |
          docker run -d --name moto -p 5000:5000 -e MOTO_IAM_LOAD_MANAGED_POLICIES=true motoserver/moto:latest
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/moto-api/ >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Create local state bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url=http://localhost:5000 --region eu-west-1 s3 mb s3://opencode-local-tfstate

      - name: Terraform init (moto backend)
        run: terraform init -reconfigure -backend-config=environments/local.backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (moto, no AWS credentials)
        run: terraform plan -var-file=environments/local.tfvars -input=false

  deploy-prod:
    needs: local-check
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=environments/prod.tfvars -input=false -out=tfplan

      - name: Upload plan (audit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: tfplan
          retention-days: 30

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Smoke test (instance reaches running)
        run: |
          terraform output
          aws ec2 wait instance-running --instance-ids "$(terraform output -raw instance_id)" --region "${{ env.AWS_REGION }}"
