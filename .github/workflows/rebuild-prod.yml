name: rebuild-prod

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY ALL to rebuild prod and erase its data volume (stable EIP is retained)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/prod/terraform.tfstate
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_github_oauth_client_id: ${{ secrets.OAUTH_CLIENT_ID }}
      TF_VAR_github_oauth_user: ${{ secrets.OAUTH_USER }}
      TF_VAR_git_user_name: ${{ secrets.GIT_USER_NAME }}
      TF_VAR_git_user_email: ${{ secrets.GIT_USER_EMAIL }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Require explicit data-loss confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DESTROY ALL"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require green main pipeline for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          [ "$CONCLUSION" = success ] || { echo "ci.yml is not green for $GITHUB_SHA (conclusion='$CONCLUSION')"; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init (S3 backend)
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Arm confirmed bucket deletion in state
        run: |
          terraform -chdir=infra plan \
            -target=aws_s3_bucket.app_bundle \
            -target=aws_s3_bucket.app_bundle_logs \
            -target=module.monitoring.aws_s3_bucket.audit \
            -var-file=environments/prod.tfvars \
            -var allow_full_destroy=true \
            -var "deployed_version=$GITHUB_SHA" \
            -input=false -out=arm-destroy.tfplan
          terraform -chdir=infra apply -input=false arm-destroy.tfplan
      - name: Plan full destroy
        run: |
          mapfile -t RESOURCES < <(terraform -chdir=infra state list | grep -v '^module.compute.aws_eip.server$')
          TARGETS=()
          for RESOURCE in "${RESOURCES[@]}"; do TARGETS+=("-target=$RESOURCE"); done
          terraform -chdir=infra plan -destroy "${TARGETS[@]}" -var-file=environments/prod.tfvars -var allow_full_destroy=true -var "deployed_version=$GITHUB_SHA" -input=false -out=destroy.tfplan
      - name: Upload destroy plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: destroy-plan-${{ github.run_attempt }}
          path: infra/destroy.tfplan
          retention-days: 30
      - name: Destroy full deployment
        run: terraform -chdir=infra apply -input=false destroy.tfplan
      - name: Create bundle bucket first
        run: |
          terraform -chdir=infra plan -target=aws_s3_bucket.app_bundle -var-file=environments/prod.tfvars -var allow_full_destroy=false -var "deployed_version=$GITHUB_SHA" -input=false -out=bundle.tfplan
          terraform -chdir=infra apply -input=false bundle.tfplan
      - name: Upload app bundle before creating host
        run: |
          BUCKET="$(terraform -chdir=infra output -raw app_bundle_bucket)"
          for FILE in compose.yaml Caddyfile switch.sh opencode.json nono-profile.json nono-version.json; do
            aws s3 cp "app/$FILE" "s3://$BUCKET/app/${GITHUB_SHA}/$FILE" --sse AES256 --region "$AWS_REGION"
          done
          for FILE in app.sh monitoring.sh prompt-smoke.sh; do
            aws s3 cp "app/host/$FILE" "s3://$BUCKET/app/${GITHUB_SHA}/host/$FILE" --sse AES256 --region "$AWS_REGION"
          done
          NONO_VERSION="$(jq -r .version app/nono-version.json)"
          NONO_TAR="$(jq -r .artifacts.tar_musl_x86_64.file app/nono-version.json)"
          NONO_SHA="$(jq -r .artifacts.tar_musl_x86_64.sha256 app/nono-version.json)"
          curl -fsSL "https://github.com/nolabs-ai/nono/releases/download/v${NONO_VERSION}/${NONO_TAR}" -o "/tmp/$NONO_TAR"
          echo "$NONO_SHA  /tmp/$NONO_TAR" | sha256sum -c -
          aws s3 cp "/tmp/$NONO_TAR" "s3://$BUCKET/app/${GITHUB_SHA}/$NONO_TAR" --sse AES256 --region "$AWS_REGION"
      - name: Plan clean recreation
        run: terraform -chdir=infra plan -var-file=environments/prod.tfvars -var allow_full_destroy=false -var "deployed_version=$GITHUB_SHA" -input=false -out=recreate.tfplan
      - name: Upload recreate plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recreate-plan-${{ github.run_attempt }}
          path: infra/recreate.tfplan
          retention-days: 30
      - name: Recreate full deployment
        run: terraform -chdir=infra apply -input=false recreate.tfplan
      - name: Wait for clean boot
        run: |
          IID="$(terraform -chdir=infra output -raw instance_id)"
          echo "recreated instance: $IID"
          aws ec2 wait instance-running --instance-ids "$IID" --region "$AWS_REGION"
          aws ec2 describe-instance-status --instance-ids "$IID" --region "$AWS_REGION" --query "InstanceStatuses[0].{system:SystemStatus.Status,instance:InstanceStatus.Status}" --output text || true
          PING=Offline
          for N in $(seq 1 60); do
            PING="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$IID" --query "InstanceInformationList[0].PingStatus" --output text --region "$AWS_REGION" 2>/dev/null || true)"
            echo "$(date -u +%H:%M:%SZ) ssm ping attempt $N/60: ${PING:-unknown}"
            [ "$PING" = Online ] && break
            sleep 10
          done
          if [ "$PING" != Online ]; then
            echo "SSM agent never came online (last: ${PING:-unknown}); console output tail:"
            aws ec2 get-console-output --instance-id "$IID" --region "$AWS_REGION" --query Output --output text 2>/dev/null | tail -n 60 || true
            exit 1
          fi
          PARAMS='{"commands":["cloud-init status --wait --long"]}'
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --timeout-seconds 600 --parameters "$PARAMS" --query Command.CommandId --output text)"
          echo "cloud-init wait CommandId: $CMD_ID"
          STATUS=Pending
          for N in $(seq 1 130); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            [ "$((N % 12))" = 0 ] && echo "$(date -u +%H:%M:%SZ) cloud-init wait poll $N/130: $STATUS"
            case "$STATUS" in Success | Failed | Cancelled | TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || true
          [ "$STATUS" = Success ]
      - name: Verify TLS, SSO, and readiness
        run: |
          URL="$(terraform -chdir=infra output -raw opencode_url)"
          READY=""
          RESP=""
          GATE=waiting
          for _ in $(seq 1 30); do
            READY="$(curl -s --max-time 10 "$URL/ready" || true)"
            RESP="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "$URL" || true)"
            case "$RESP" in 302*oauth2* | 401*) GATE=ready ;; *) GATE=waiting ;; esac
            [ "$READY" = ready ] && [ "$GATE" = ready ] && exit 0
            sleep 20
          done
          echo "recreated deployment failed edge checks: ready='$READY' gate='$RESP'"
          exit 1
      - name: Verify real provider prompt
        run: scripts/run-prompt-smoke.sh "$(terraform -chdir=infra output -raw instance_id)" "$GITHUB_SHA"
      - name: Upload prompt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-prompt-smoke-${{ github.run_attempt }}
          path: smoke-artifacts/prompt-smoke.log
          retention-days: 7
