name: server-mkdir

on:
  workflow_dispatch:
    inputs:
      dirname:
        description: Directory name to create under /root on the server (letters, numbers, dashes only)
        required: true
        default: main-workspace
        type: string

permissions:
  contents: read

jobs:
  mkdir:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-1
    steps:
      - name: Validate directory name
        env:
          DIRNAME: ${{ inputs.dirname }}
        run: |
          case "$DIRNAME" in
            "" | *[!A-Za-z0-9-]*) echo "::error::dirname must match [A-Za-z0-9-]+" >&2; exit 1 ;;
          esac
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create directory on the server via SSM
        env:
          DIRNAME: ${{ inputs.dirname }}
        run: |
          # Instance Name tag is <project>-<environment>-server (see infra/environments/prod.tfvars).
          IID="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters 'Name=tag:Name,Values=opencode-prod-server' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          case "$IID" in i-*) ;; *) echo "no running server instance found" >&2; exit 1 ;; esac
          echo "target instance: $IID"
          PARAMS="$(jq -cn --arg d "$DIRNAME" '{commands: ["mkdir -p /root/" + $d + " && ls -ld /root/" + $d]}')"
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --timeout-seconds 60 --parameters "$PARAMS" --query Command.CommandId --output text)"
          STATUS=Pending
          for _ in $(seq 1 24); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success | Failed | Cancelled | TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || true
          [ "$STATUS" = Success ]
