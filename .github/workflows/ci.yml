# ci — commit checks plus automatic prod deploy, one workflow graph.
# Runs on every push to main and every PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Silence the `git init` default-branch hint actions/checkout prints on
# every job (13 lines of log noise per job; issue #5). init.defaultBranch
# only affects `git init`, nothing else the pipeline runs.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            infra:
              - '**/*.tf'
              # Shell is host-replacing ONLY under modules/ (user_data
              # bootstrap). Stage scripts (app/host/**, app/switch.sh)
              # and test scripts (scripts/**) ship over SSM via
              # deploy-app — a bare '**/*.sh' here would mark every
              # stage change as infra and skip deploy-app forever,
              # uploading new stages to S3 that never execute.
              - 'modules/**/*.sh'
              - '**/*.tfvars'
              - '.terraform.lock.hcl'
              - 'bootstrap/.terraform.lock.hcl'
            app:
              - 'app/compose.yaml'
              - 'app/Caddyfile'
              - 'app/switch.sh'
              - 'app/opencode.json'
              - 'app/nono-profile.json'
              - 'app/nono-version.json'
              - 'app/host/**'
            pipeline:
              - '.github/**'
              - 'Makefile'
              - 'compose.yaml'
              - 'local.backend.hcl'
              - 'environments/local.tfvars'
              - '.pre-commit-config.yaml'
              - '.secrets.baseline'
              - 'scripts/**'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      # No pre-commit/action: v3.0.1 bundles actions/cache@v4 (Node 20,
      # deprecated) with no newer release upstream. pip + cache@v6
      # (Node 24) runs the same hooks warning-free; switch back when
      # upstream ships a Node 24 release (revisit 2026-12).
      - name: Install pre-commit
        run: pip install "pre-commit==4.6.2"
      - name: Restore pre-commit hook envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on all files
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - name: Validate opencode.json against its $schema
        run: |
          pip install "jsonschema==4.25.1"
          python scripts/validate-opencode-config.py
      - name: Save pre-commit hook envs
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

  terraform:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init (backend disabled for CI)
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate

  local:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Start moto server
        run: |
          docker run -d --name moto -p 5000:5000 -e MOTO_IAM_LOAD_MANAGED_POLICIES=true motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/moto-api/ >/dev/null; then break; fi
            sleep 2
          done
      - name: Create local state bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url=http://localhost:5000 --region eu-west-1 s3 mb s3://opencode-local-tfstate
      - name: Terraform init (moto backend)
        run: terraform init -reconfigure -backend-config=environments/local.backend.hcl -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan (moto, no AWS credentials)
        run: terraform plan -var-file=environments/local.tfvars -input=false
      - name: Terraform apply (moto throwaway, compute only)
        run: terraform apply -target=module.compute -var-file=environments/local.tfvars -input=false -auto-approve
      - name: Idempotence check (second plan on non-empty state must be empty)
        run: |
          terraform plan -target=module.compute -var-file=environments/local.tfvars -input=false -detailed-exitcode || exitcode=$?
          if [ "${exitcode:-0}" != "0" ]; then echo "non-idempotent plan on existing state"; exit 1; fi

  app-test:
    # Full-chain compose test on an x86_64 runner: the only pre-prod
    # place the sandboxed backend really runs. Laptops here are ARM,
    # where upstream ships no musl nono, so test-boot falls back to a
    # plain backend and the sandbox stays unproven until prod. A broken
    # sandbox entrypoint reached prod twice that way; this job is the
    # gate that catches it.
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Full-chain app test (compose, dummy env, sandboxed backend)
        # test-boot dumps backend logs itself on failure (its ERR trap
        # runs before the teardown that would delete them).
        run: ./scripts/test-boot.sh

  bootstrap:
    # Runs in parallel with terraform/local: bootstrap only manages
    # the deploy trust (role/OIDC/policy) and never touches infra
    # state, so there is no ordering dependency. (Same prod-deploy
    # concurrency group still serializes it against deploy-prod.)
    needs: [pre-commit, changes]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true') && needs.pre-commit.result == 'success'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: bootstrap
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/bootstrap/terraform.tfstate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init (S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Adopt manual resources (one-time imports, idempotent)
        run: |
          terraform import aws_s3_bucket.state "${{ vars.TF_STATE_BUCKET }}" || true
          terraform import aws_s3_bucket_versioning.state "${{ vars.TF_STATE_BUCKET }}" || true
          terraform import aws_s3_bucket_server_side_encryption_configuration.state "${{ vars.TF_STATE_BUCKET }}" || true
          terraform import aws_s3_bucket_public_access_block.state "${{ vars.TF_STATE_BUCKET }}" || true
          terraform import aws_iam_role.deploy opencode-server-deploy || true
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          terraform import aws_iam_openid_connect_provider.github "arn:aws:iam::$ACCT:oidc-provider/token.actions.githubusercontent.com" || true
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan -detailed-exitcode || exitcode=$?
          exitcode=${exitcode:-0}
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then exit 1; fi
      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false tfplan
      - name: Remove bridge policy (TF-managed policy now covers everything)
        if: steps.plan.outputs.exitcode == '2'
        run: aws iam delete-role-policy --role-name opencode-server-deploy --policy-name bridge || true

  deploy-prod:
    needs: [pre-commit, terraform, local, app-test, bootstrap, changes]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true') && needs.pre-commit.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.local.result == 'success' || needs.local.result == 'skipped') && (needs.app-test.result == 'success' || needs.app-test.result == 'skipped') && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/prod/terraform.tfstate
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_github_oauth_client_id: ${{ secrets.OAUTH_CLIENT_ID }}
      TF_VAR_github_oauth_user: ${{ secrets.OAUTH_USER }}
      TF_VAR_git_user_name: ${{ secrets.GIT_USER_NAME }}
      TF_VAR_git_user_email: ${{ secrets.GIT_USER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init (S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Upload app bundle (S3, versioned)
        run: |
          BUCKET="$(terraform output -raw app_bundle_bucket 2>/dev/null || true)"
          if [ -z "$BUCKET" ] || ! aws s3api head-bucket --bucket "$BUCKET" --region "${{ env.AWS_REGION }}" 2>/dev/null; then echo "no bundle bucket yet, skipping"; exit 0; fi
          aws s3 cp app/compose.yaml "s3://$BUCKET/app/compose.yaml" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/Caddyfile "s3://$BUCKET/app/Caddyfile" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/switch.sh "s3://$BUCKET/app/switch.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/opencode.json "s3://$BUCKET/app/opencode.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-profile.json "s3://$BUCKET/app/nono-profile.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-version.json "s3://$BUCKET/app/nono-version.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/app.sh "s3://$BUCKET/app/host/app.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/monitoring.sh "s3://$BUCKET/app/host/monitoring.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          # Pinned nono musl tarball (static-pie: host and
          # container binary source). SHA-verified; boot installs
          # from disk, never curl-at-boot (ADR-0003, ADR-0027).
          NONO_VERSION="$(jq -r .version app/nono-version.json)"
          MUSL_TAR="$(jq -r .artifacts.tar_musl_x86_64.file app/nono-version.json)"
          MUSL_SHA="$(jq -r .artifacts.tar_musl_x86_64.sha256 app/nono-version.json)"
          curl -fsSL "https://github.com/nolabs-ai/nono/releases/download/v${NONO_VERSION}/${MUSL_TAR}" -o "/tmp/${MUSL_TAR}"
          echo "${MUSL_SHA}  /tmp/${MUSL_TAR}" | sha256sum -c -
          aws s3 cp "/tmp/${MUSL_TAR}" "s3://$BUCKET/app/${MUSL_TAR}" --sse AES256 --region "${{ env.AWS_REGION }}"
      - name: Terraform validate
        run: terraform validate
      # Fail-open alarm check (issue #13): an empty ALERT_EMAIL leaves the
      # alarms paging nobody. Warn loudly but never block the deploy.
      - name: Warn when ALERT_EMAIL is unset (alarms notify nobody)
        run: |
          if [ -z "${{ secrets.ALERT_EMAIL }}" ]; then
            echo "::warning::ALERT_EMAIL is unset — intrusion alarms page nobody. Set the repo secret ALERT_EMAIL, then confirm the SNS subscription email (PendingConfirmation sends nothing)."
          else
            echo "ALERT_EMAIL is set; email subscription active."
          fi
      - name: Terraform plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform plan -var-file=environments/prod.tfvars -var "deployed_version=$GITHUB_SHA" -input=false -out=tfplan -detailed-exitcode || exitcode=$?
          exitcode=${exitcode:-0}
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then exit 1; fi
      - name: Upload plan (audit)
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: tfplan
          retention-days: 30
      - name: No changes to apply
        if: steps.plan.outputs.exitcode == '0'
        run: echo "Plan is empty — skipping apply and smoke test."
      - name: Terraform apply
        id: apply
        if: steps.plan.outputs.exitcode == '2'
        run: |
          IID_BEFORE="$(terraform output -raw instance_id 2>/dev/null || true)"
          echo "iid_before=$IID_BEFORE" >> "$GITHUB_OUTPUT"
          terraform apply -input=false tfplan
      # A tag-only plan (e.g. the DeployedRef bump, which changes on
      # every commit) applies in place on the same instance: no fresh
      # boot, so the boot gate would read a stale cloud-init signal
      # and smoke would test the OLD code — failing on pre-existing
      # breakage and blocking the deploy-app healer. Gate and smoke
      # only run when the instance was actually replaced.
      - name: Detect instance replacement
        id: replaced
        if: steps.plan.outputs.exitcode == '2'
        run: |
          IID_AFTER="$(terraform output -raw instance_id 2>/dev/null || true)"
          if [ -n "$IID_AFTER" ] && [ "$IID_AFTER" != "${{ steps.apply.outputs.iid_before }}" ]; then
            echo "replaced=true (instance $IID_AFTER)" >> "$GITHUB_OUTPUT"
            echo "replaced=true" >> "$GITHUB_OUTPUT"
          else
            echo "replaced=false (same instance ${IID_AFTER:-none})" >> "$GITHUB_OUTPUT"
            echo "replaced=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload app bundle again (covers bucket-creating applies)
        if: steps.plan.outputs.exitcode == '2'
        run: |
          BUCKET="$(terraform output -raw app_bundle_bucket)"
          aws s3 cp app/compose.yaml "s3://$BUCKET/app/compose.yaml" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/Caddyfile "s3://$BUCKET/app/Caddyfile" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/switch.sh "s3://$BUCKET/app/switch.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/opencode.json "s3://$BUCKET/app/opencode.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-profile.json "s3://$BUCKET/app/nono-profile.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-version.json "s3://$BUCKET/app/nono-version.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/app.sh "s3://$BUCKET/app/host/app.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/monitoring.sh "s3://$BUCKET/app/host/monitoring.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          # Pinned nono musl tarball (static-pie: host and
          # container binary source). SHA-verified; boot installs
          # from disk, never curl-at-boot (ADR-0003, ADR-0027).
          NONO_VERSION="$(jq -r .version app/nono-version.json)"
          MUSL_TAR="$(jq -r .artifacts.tar_musl_x86_64.file app/nono-version.json)"
          MUSL_SHA="$(jq -r .artifacts.tar_musl_x86_64.sha256 app/nono-version.json)"
          curl -fsSL "https://github.com/nolabs-ai/nono/releases/download/v${NONO_VERSION}/${MUSL_TAR}" -o "/tmp/${MUSL_TAR}"
          echo "${MUSL_SHA}  /tmp/${MUSL_TAR}" | sha256sum -c -
          aws s3 cp "/tmp/${MUSL_TAR}" "s3://$BUCKET/app/${MUSL_TAR}" --sse AES256 --region "${{ env.AWS_REGION }}"
      - name: Boot gate (cloud-init success signal, before smoke)
        if: steps.plan.outputs.exitcode == '2' && steps.replaced.outputs.replaced == 'true'
        run: |
          IID="$(terraform output -raw instance_id)"
          aws ec2 wait instance-running --instance-ids "$IID" --region "${{ env.AWS_REGION }}"
          # Wait for the SSM agent to come online (instance-running
          # only means the hypervisor started; SSM/cloud-init lag it).
          for _ in $(seq 1 30); do
            aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$IID" --query "InstanceInformationList[0].PingStatus" --output text --region "${{ env.AWS_REGION }}" 2>/dev/null | grep -q Online && break
            sleep 10
          done
          # Block until cloud-init finishes, then fail on its signal:
          # `cloud-init status --wait` exits non-zero when any boot
          # module (including user_data scripts-user) errored. The old
          # order ran smoke first, so a poisoned boot still reported
          # green whenever the edge alone answered `/`.
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" --document-name "AWS-RunShellScript" --timeout-seconds 600 --parameters 'commands=["cloud-init status --wait --long"]' --query "Command.CommandId" --output text)"
          echo "boot gate: waiting on cloud-init (poll every 5s, progress probe every ~60s)"
          PROBE_N=0
          for _ in $(seq 1 130); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            echo "$(date -u +%H:%M:%SZ) ssm status: $STATUS"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut) break;; esac
            # The --wait output only arrives at the end, so surface
            # boot progress separately: a lightweight concurrent probe
            # printing cloud-init status plus the log tail. Probe
            # failures never fail the gate — the main wait decides.
            PROBE_N=$((PROBE_N + 1))
            if [ "$((PROBE_N % 12))" = "0" ]; then
              echo "--- boot progress probe #$((PROBE_N / 12)) ---"
              PROBE_ID="$(aws ssm send-command --instance-ids "$IID" --document-name "AWS-RunShellScript" --timeout-seconds 60 --parameters 'commands=["cloud-init status --long || true", "echo --- cloud-init-output.log tail ---", "tail -n 8 /var/log/cloud-init-output.log 2>/dev/null || echo (log not ready)"]' --query "Command.CommandId" --output text 2>/dev/null || true)"
              if [ -n "${PROBE_ID:-}" ]; then
                for _p in $(seq 1 10); do
                  PSTATUS="$(aws ssm get-command-invocation --command-id "$PROBE_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
                  [ "$PSTATUS" = "Success" ] && break
                  case "$PSTATUS" in Failed|Cancelled|TimedOut) break;; esac
                  sleep 5
                done
                aws ssm get-command-invocation --command-id "$PROBE_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || echo "(probe output unavailable)"
              else
                echo "(progress probe send failed; main wait continues)"
              fi
            fi
            sleep 5
          done
          echo "--- cloud-init status --wait --long ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || echo "(no output)"
          [ "$STATUS" = "Success" ] || { echo "boot gate failed: cloud-init reported errors (ssm: $STATUS)"; exit 1; }
          echo "boot gate passed: cloud-init clean"
      - name: Smoke test (site answers through TLS + SSO gate + /ready)
        if: steps.plan.outputs.exitcode == '2' && steps.replaced.outputs.replaced == 'true'
        run: |
          terraform output
          aws ec2 wait instance-running --instance-ids "$(terraform output -raw instance_id)" --region "${{ env.AWS_REGION }}"
          URL="$(terraform output -raw opencode_url)"
          case "$URL" in https://*) ;; *) echo "no public URL ($URL), skipping HTTP check"; exit 0;; esac
          GATE=""
          for _ in $(seq 1 30); do
            RESP="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "$URL" || true)"
            case "$RESP" in
              302*oauth2*) echo "site up: SSO gate at $URL ($RESP)"; GATE=yes; break;;
              401*) echo "site up: legacy 401 auth gate at $URL"; GATE=yes; break;;
            esac
            sleep 20
          done
          [ -n "$GATE" ] || { echo "site never returned the SSO gate (last: $RESP)"; exit 1; }
          # /ready proves a backend color actually serves behind the
          # edge. The `/` gate above is answered by Caddy+oauth2-proxy
          # alone and once shipped a green build with no serving
          # backend (issue #30 entrypoint incident).
          for _ in $(seq 1 30); do
            READY="$(curl -s --max-time 10 "$URL/ready" || true)"
            [ "$READY" = "ready" ] && { echo "readiness gate answers 'ready'"; exit 0; }
            sleep 20
          done
          echo "edge up but /ready never answered 'ready' (last: $READY)"; exit 1
      - name: Boot warnings audit (fresh boot only, informational)
        if: steps.plan.outputs.exitcode == '2' && steps.replaced.outputs.replaced == 'true'
        run: |
          IID="$(terraform output -raw instance_id 2>/dev/null || true)"
          if [ -z "$IID" ]; then echo "boot audit skipped: no instance id"; exit 0; fi
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"journalctl -p warning -b --no-pager 2>&1 | tail -n 40\", \"grep -i -E 'warn|deprecat|fail' /var/log/cloud-init-output.log | tail -n 40 || true\"]" \
            --query "Command.CommandId" --output text 2>/dev/null || true)"
          if [ -z "$CMD_ID" ]; then echo "boot audit skipped: SSM send-command failed"; exit 0; fi
          for _ in $(seq 1 24); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          echo "--- journal warnings (fresh boot) + cloud-init warning lines ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || echo "(no output)"
          exit 0
      - name: Boot diagnostics (only when apply ran and something above failed)
        if: failure() && steps.plan.outputs.exitcode == '2'
        run: |
          set +e
          IID="$(terraform output -raw instance_id 2>/dev/null || true)"
          if [ -z "$IID" ]; then echo "No EC2 instance_id available for boot diagnostics"; exit 0; fi
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" --document-name "AWS-RunShellScript" --parameters 'commands=["echo ===== compose ps =====","docker compose -f /opt/opencode/compose.yaml ps || true","echo ===== backend logs =====","docker compose -f /opt/opencode/compose.yaml logs --no-color --tail 120 opencode-blue opencode-green 2>&1 || true","echo ===== caddy logs =====","docker compose -f /opt/opencode/compose.yaml logs --no-color --tail 60 caddy 2>&1 || true","echo ===== docker status =====","systemctl is-active docker || true","echo ===== cloud-init-output.log tail =====","tail -n 60 /var/log/cloud-init-output.log 2>&1 || true","echo ===== cloud-init.log tail =====","tail -n 60 /var/log/cloud-init.log 2>&1 || true"]' --query "Command.CommandId" --output text 2>/dev/null || true)"
          if [ -z "$CMD_ID" ]; then echo "SSM send-command failed"; exit 0; fi
          for _ in $(seq 1 30); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            echo "ssm status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text 2>/dev/null || true

  deploy-app:
    needs: [pre-commit, app-test, deploy-prod, changes]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pre-commit.result == 'success' && (needs.app-test.result == 'success' || needs.app-test.result == 'skipped') && (needs.deploy-prod.result == 'success' || needs.deploy-prod.result == 'skipped') && (needs.changes.result != 'success' || (needs.changes.outputs.app == 'true' && needs.changes.outputs.infra != 'true'))
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/prod/terraform.tfstate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init (S3 backend, for outputs)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Upload app bundle
        run: |
          BUCKET="$(terraform output -raw app_bundle_bucket)"
          aws s3 cp app/compose.yaml "s3://$BUCKET/app/compose.yaml" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/Caddyfile "s3://$BUCKET/app/Caddyfile" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/switch.sh "s3://$BUCKET/app/switch.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/opencode.json "s3://$BUCKET/app/opencode.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-profile.json "s3://$BUCKET/app/nono-profile.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/nono-version.json "s3://$BUCKET/app/nono-version.json" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/app.sh "s3://$BUCKET/app/host/app.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
          aws s3 cp app/host/monitoring.sh "s3://$BUCKET/app/host/monitoring.sh" --sse AES256 --region "${{ env.AWS_REGION }}"
      - name: Blue-green switch via SSM
        run: |
          IID="$(terraform output -raw instance_id)"
          BUCKET="$(terraform output -raw app_bundle_bucket)"
          # --timeout-seconds 720: SSM kills the command on the host if it
          # runs longer than 12 min (image pull + switch should be <5 min).
          # CI polls 150x5s=750s to outlast the SSM timeout and see the final
          # status (TimedOut) rather than exit with an ambiguous Pending.
          CMD_ID="$(aws ssm send-command --instance-ids "$IID" --document-name "AWS-RunShellScript" --timeout-seconds 720 --parameters "commands=[\"cd /opt/opencode && aws s3 cp s3://$BUCKET/app/compose.yaml compose.yaml --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/Caddyfile Caddyfile --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/switch.sh switch.sh --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/opencode.json opencode.json --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/nono-profile.json nono-profile.json --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/nono-version.json nono-version.json --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/host/app.sh host/app.sh --region ${{ env.AWS_REGION }} && aws s3 cp s3://$BUCKET/app/host/monitoring.sh host/monitoring.sh --region ${{ env.AWS_REGION }} && chmod +x switch.sh host/app.sh host/monitoring.sh && host/app.sh secrets && host/monitoring.sh && ./switch.sh deploy && (host/app.sh git-setup || echo 'WARNING: git setup failed (non-blocking)')\"]" --query "Command.CommandId" --output text)"
          for _ in $(seq 1 150); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            echo "ssm status: $STATUS"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut) exit 1;; esac
            sleep 5
          done
          [ "$STATUS" = "Success" ]
      - name: Smoke test
        run: |
          URL="$(terraform output -raw opencode_url)"
          case "$URL" in https://*) ;; *) echo "no public URL ($URL), skipping HTTP check"; exit 0;; esac
          READY="$(curl -s --max-time 10 "$URL/ready" || true)"
          [ "$READY" = "ready" ] || { echo "expected body 'ready' from /ready, got: $READY"; exit 1; }
          echo "readiness gate answers 'ready'"
          for _ in $(seq 1 30); do
            RESP="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "$URL" || true)"
            case "$RESP" in
              302*oauth2*) echo "site up: SSO gate at $URL ($RESP)"; exit 0;;
              401*) echo "site up: legacy 401 auth gate at $URL"; exit 0;;
            esac
            sleep 20
          done
          echo "site never returned the SSO gate (last: $RESP)"; exit 1
