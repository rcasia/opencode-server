# ci — commit checks plus automatic prod deploy, one workflow graph.
# Runs on every push to main and every PR.
# Jobs: changes (paths-filter) -> pre-commit always, terraform + local only
#   when infra/pipeline files changed, then deploy-prod (main pushes only,
#   needs green-or-skipped checks): OIDC -> S3 init -> plan -> apply
#   (only when the plan has changes) -> smoke test. PR runs skip deploy-prod
#   (no secrets on PRs, never deploy). Docs-only pushes skip the slow jobs.
#   All gates fail open: if the filter job breaks, everything runs.
# Requirements: AWS_ROLE_ARN secret + TF_STATE_BUCKET variable, else the
#   deploy job fails red. Optional: ALERT_EMAIL variable (intrusion alarm
#   recipient; absent = alarms exist but email no one). Rollback: revert on
#   main and push; next green run re-applies (state versioned in S3).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            infra:
              - '**/*.tf'
              - '**/*.sh'
              - '**/*.tfvars'
              - '.terraform.lock.hcl'
              - 'app/**'
            pipeline:
              - '.github/**'
              - 'Makefile'
              - 'compose.yaml'
              - 'local.backend.hcl'
              - 'environments/local.tfvars'
              - '.pre-commit-config.yaml'
              - '.secrets.baseline'
              - 'scripts/**'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  terraform:
    needs: [changes]
    # Fail open: run unless the filter positively says docs-only.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled for CI)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  local:
    needs: [changes]
    # Fail open: run unless the filter positively says docs-only.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Start moto server
        run: |
          docker run -d --name moto -p 5000:5000 -e MOTO_IAM_LOAD_MANAGED_POLICIES=true motoserver/moto:latest
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/moto-api/ >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Create local state bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url=http://localhost:5000 --region eu-west-1 s3 mb s3://opencode-local-tfstate

      - name: Terraform init (moto backend)
        run: terraform init -reconfigure -backend-config=environments/local.backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (moto, no AWS credentials)
        run: terraform plan -var-file=environments/local.tfvars -input=false

      - name: Bootstrap test (rendered user_data executes in AL2023)
        run: ./scripts/test-bootstrap.sh

  deploy-prod:
    needs: [pre-commit, terraform, local, changes]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.pipeline == 'true') && needs.pre-commit.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.local.result == 'success' || needs.local.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/prod/terraform.tfstate
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -var-file=environments/prod.tfvars -var "deployed_version=$GITHUB_SHA" -input=false -out=tfplan -detailed-exitcode || exitcode=$?
          exitcode=${exitcode:-0}
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then exit 1; fi

      - name: Upload plan (audit)
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: tfplan
          retention-days: 30

      - name: No changes to apply
        if: steps.plan.outputs.exitcode == '0'
        run: echo "Plan is empty — skipping apply and smoke test."

      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false tfplan

      - name: Smoke test (site answers through TLS + auth gate)
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform output
          aws ec2 wait instance-running --instance-ids "$(terraform output -raw instance_id)" --region "${{ env.AWS_REGION }}"
          URL="$(terraform output -raw opencode_url)"
          case "$URL" in https://*) ;; *) echo "no public URL ($URL), skipping HTTP check"; exit 0;; esac
          for _ in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)"
            if [ "$CODE" = "401" ]; then echo "site up: 401 auth gate at $URL"; exit 0; fi
            sleep 20
          done
          echo "site never returned 401 (last: $CODE)"; exit 1
