# ci — commit checks plus automatic prod deploy, one workflow graph.
# Runs on every push to main and every PR.
# Jobs: pre-commit -> terraform -> local (moto plan, zero credentials),
#   then deploy-prod (main pushes only): OIDC -> S3 init -> plan -> apply
#   (only when the plan has changes) -> smoke test. PR runs skip deploy-prod (no secrets on PRs, never deploy).
# Requirements: AWS_ROLE_ARN secret + TF_STATE_BUCKET variable, else the
#   deploy job fails red. Rollback: revert on main and push; next green run
#   re-applies (state versioned in S3).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled for CI)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  local:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Start moto server
        run: |
          docker run -d --name moto -p 5000:5000 -e MOTO_IAM_LOAD_MANAGED_POLICIES=true motoserver/moto:latest
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/moto-api/ >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Create local state bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url=http://localhost:5000 --region eu-west-1 s3 mb s3://opencode-local-tfstate

      - name: Terraform init (moto backend)
        run: terraform init -reconfigure -backend-config=environments/local.backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (moto, no AWS credentials)
        run: terraform plan -var-file=environments/local.tfvars -input=false

  deploy-prod:
    needs: [pre-commit, terraform, local]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: eu-west-1
      TF_STATE_KEY: opencode-server/prod/terraform.tfstate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -var-file=environments/prod.tfvars -input=false -out=tfplan -detailed-exitcode || exitcode=$?
          exitcode=${exitcode:-0}
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then exit 1; fi

      - name: Upload plan (audit)
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: tfplan
          retention-days: 30

      - name: No changes to apply
        if: steps.plan.outputs.exitcode == '0'
        run: echo "Plan is empty — skipping apply and smoke test."

      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false tfplan

      - name: Smoke test (instance reaches running)
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform output
          aws ec2 wait instance-running --instance-ids "$(terraform output -raw instance_id)" --region "${{ env.AWS_REGION }}"
