# ci — commit stage. Runs on every push to main and every PR (~1 min).
# Jobs: pre-commit (hooks) -> terraform (fmt -check, init, validate)
#   -> local (moto plan, zero AWS credentials).
# A green ci run on main is the ONLY trigger for prod deploys (see deploy.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled for CI)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  local:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Start moto server
        run: |
          docker run -d --name moto -p 5000:5000 -e MOTO_IAM_LOAD_MANAGED_POLICIES=true motoserver/moto:latest
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/moto-api/ >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Create local state bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url=http://localhost:5000 --region eu-west-1 s3 mb s3://opencode-local-tfstate

      - name: Terraform init (moto backend)
        run: terraform init -reconfigure -backend-config=environments/local.backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (moto, no AWS credentials)
        run: terraform plan -var-file=environments/local.tfvars -input=false
